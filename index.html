
<!DOCTYPE html>
<html>
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Load MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Makes the camera fill the screen -->
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      a-scene {
        width: 100%;
        height: 100vh;
      }
    </style>

  </head>

  <body>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind"
      embedded
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <!-- Overlay image -->
      <a-assets>
        <img id="secret-image" src="./your-ar-image.png">
      </a-assets>

      <!-- Camera -->
      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <!-- Image recognition -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- Image displayed when target is recognized -->
        <a-image
          src="#secret-image"
          position="0 0 0"
          height="0.552"
          width="1">
        </a-image>

      </a-entity>

    </a-scene>

  </body>
</html>
